<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Honkai: Star Rail - Content Release Order</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E90N0X8HS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6E90N0X8HS');
    </script>

  </head>

  <body>
    <div class="container">
      <h1>Honkai: Star Rail - Content Release Order</h1>

      <div id="last-updated"></div>

      <div class="table-area">
        <div class="filters">
          <div class="version-filter">
            <span style="font-weight: bold">Version:</span>

            <div class="version-links">
              <a href="#" data-version="all">All</a> |
              <a href="#" data-version="Pre">Pre</a> |
              <a href="#" data-version="1">Version 1</a> |
              <a href="#" data-version="2">Version 2</a> |
              <a href="#" data-version="3">Version 3</a> |
              <a href="#" data-version="4">Version 4</a>
            </div>

            <select class="version-select">
              <option value="all">All</option>
              <option value="Pre">Pre</option>
              <option value="1">Version 1</option>
              <option value="2">Version 2</option>
              <option value="3">Version 3</option>
              <option value="4">Version 4</option>
            </select>
          </div>

          <div class="type-filter">
            <span style="font-weight: bold">Type:</span>
            <label class="filter-pill">
              <input type="checkbox" name="Mission" class="checkbox" checked />
              <span>Mission</span>
            </label>

            <label class="filter-pill">
              <input type="checkbox" name="Event" class="checkbox" checked />
              <span>Event</span>
            </label>

            <label class="filter-pill">
              <input type="checkbox" name="Video" class="checkbox" checked />
              <span>Video</span>
            </label>

            <label class="filter-pill">
              <input type="checkbox" name="Article" class="checkbox" checked />
              <span>Article</span>
            </label>
          </div>
        </div>

        <div class="table-wrapper">
          <table border="1" id="missions-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Release Date</th>
                <th>Series</th>
                <th>Type</th>
                <th>Version</th>
                <th>Progress</th>
              </tr>
            </thead>
            <tbody>
              <!-- JS adds rows here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
