name: Update HSR content

on:
  schedule:
    - cron: "0 9 * * 1" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build content
        run: ruby builder/build.rb

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content.json index.html

          git diff --cached --quiet || git commit -m "Update HSR content"

          git push

      - name: Create update timestamp
        run: |
          echo "{\"lastUpdated\":\"$(date -u +"%Y-%m-%d")\"}" > updated.json